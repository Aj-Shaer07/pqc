services:
  # MQTT Broker (Simulating the wireless RF mesh communication channel)
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: pqc_mqtt_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - swarm-net
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'

  # Ground Station Node (Issues, signs, and dispatches PQC mission commands)
  ground-station:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqc_ground_station
    depends_on:
      - mqtt-broker
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
      - NODE_ROLE=ground_station
      - SWARM_MESH_KEY=${SWARM_MESH_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    networks:
      - swarm-net
    command: ["python3", "run_ground_station.py"]
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  # Drone Node Template (Dynamic scaling: docker compose up --scale drone=N)
  drone:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mqtt-broker
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
      - NODE_ROLE=drone
      - THRESHOLD=3
      - SWARM_MESH_KEY=${SWARM_MESH_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    networks:
      - swarm-net
    command: ["python3", "run_drone_node.py"]
    deploy:
      resources:
        limits:
          # Simulates constrained drone onboard companion computers (e.g. Raspberry Pi Zero 2W / CM4)
          memory: ${DRONE_MEM_LIMIT:-256m}
          cpus: ${DRONE_CPU_LIMIT:-0.50}

networks:
  swarm-net:
    name: swarm-net
    driver: bridge
